[project]
name = "support"
version = "0.1.0"
description = "Multi-agent customer support system for a fictional Indian fashion D2C store (portfolio project)."
authors = [
    { name = "errorboy4O4", email = "69593024+errorboy4O4@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.8.5",
    "langchain-google-genai>=4.5.3",
    "langchain-groq>=1.2.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

# All commands run from backend/. The eval code lives in ../evals (D12 layout)
# and is linted, type-checked and tested with the same settings.

[tool.pytest.ini_options]
testpaths = ["tests", "../evals"]
# Repo root on sys.path so tests can import evals.model_check.*
pythonpath = [".."]
addopts = "-ra"
markers = ["db: needs the Postgres test database (TEST_DATABASE_URL)"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests", "../evals"]
extraPaths = [".."]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
