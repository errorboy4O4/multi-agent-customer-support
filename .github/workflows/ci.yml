name: CI

# Deterministic checks only (D12): no secrets, no LLM calls.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check . ../evals

      - name: Format check
        run: uv run ruff format --check . ../evals

      - name: Type check
        run: uv run pyright

      - name: Tests
        run: uv run pytest
