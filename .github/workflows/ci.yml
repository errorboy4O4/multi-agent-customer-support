name: CI

# Deterministic checks only (D12): no secrets, no LLM calls.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # Postgres for the database tests (M2). Throwaway credentials, no secrets (D12).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support -d support_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://support:support@localhost:5432/support_test
      # A missing database fails the run instead of skipping the database tests.
      REQUIRE_DB: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check . ../evals

      - name: Format check
        run: uv run ruff format --check . ../evals

      - name: Type check
        run: uv run pyright

      - name: Tests
        run: uv run pytest
